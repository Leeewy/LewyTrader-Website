  <script>
(function () {
  var key = "lewytrader-theme";
  var theme = "light";
  try {
    var stored = localStorage.getItem(key);
    if (stored === "light" || stored === "dark") {
      theme = stored;
    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      theme = "dark";
    }
  } catch (err) {
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      theme = "dark";
    }
  }
  document.documentElement.setAttribute("data-theme", theme);

  window.LewyTrader = window.LewyTrader || {};
  window.LewyTrader.toggleTheme = function () {
    var html = document.documentElement;
    var current = html.getAttribute("data-theme") === "dark" ? "dark" : "light";
    var next = current === "dark" ? "light" : "dark";
    try {
      localStorage.setItem(key, next);
    } catch (err) {
      // Ignore storage failures (private mode, file:// restrictions).
    }
    html.setAttribute("data-theme", next);
    document.dispatchEvent(
      new CustomEvent("lewytrader-theme-change", { detail: { theme: next } })
    );
    if (typeof window.LewyTrader.updateThemeToggle === "function") {
      window.LewyTrader.updateThemeToggle();
    }
  };
})();
</script>
  <script>window.LewyTrader=window.LewyTrader||{};window.LewyTrader.termGlossary={"AI":"Attractiveness, with conviction in parentheses. Attractiveness is how strong the case is to own the company; conviction is how sure the analyst is of this call.","Attractiveness":"How strong the case is to own this company now: 100 is the strongest case to own, 0 the strongest case to exit.","Conviction":"How sure the analyst is about this call. Independent of attractiveness \u2014 a confident no-action can still score high.","Research":"Research score from the selected AI review. Based on the data available when that review was generated.","Research score":"A score from reported figures only: growth, profitability and price versus its own trend. No AI is involved.","Research rank":"Where this company sits among active watchlist names on the Research score alone. Rank 1 is the highest.","Static Research":"Research score calculated from the latest available data. This may differ from the score used in the selected AI review.","latest data":"Research score calculated from the latest available data. This may differ from the score used in the selected AI review.","Score":"A blend of Research and the analyst\u2019s attractiveness and conviction. Used only to rank ideas, not as a buy or sell signal.","Score (Convince)":"Attractiveness, with conviction in parentheses. Attractiveness is how strong the case is to own the company; conviction is how sure the analyst is of this call.","Adjusted Close":"Closing price adjusted for splits and dividends, so history stays comparable over time.","SMA50":"Average closing price over the last 50 trading days.","SMA200":"Average closing price over the last 200 trading days.","Price vs SMA200":"Where the latest close sits relative to the 200-day average \u2014 a simple read on the longer-term trend.","RSI":"Relative Strength Index: a 0\u2013100 momentum reading. High values often mean the move has been stretched to the upside; low values, to the downsi
